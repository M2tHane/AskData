[importlinter]
root_package = app
include_external_packages = True

[importlinter:contract:core-independent]
name = Core never imports business modules or application entrypoints
type = forbidden
source_modules = app.core
forbidden_modules =
    app.modules
    app.main
    app.worker

[importlinter:contract:business-layers]
name = Business api -> service -> repository (applies as modules are added)
type = layers
containers = app.modules.*
layers =
    (api)
    (service)
    (repository)

[importlinter:contract:api-no-repository]
name = API only reaches repositories through services
type = forbidden
source_modules = app.modules.*.api
forbidden_modules =
    app.modules.*.repository
    app.modules.*.models
allow_indirect_imports = True

[importlinter:contract:repository-ownership]
name = A module only imports its own repositories and database models
type = forbidden
source_modules = app.modules.*
forbidden_modules =
    app.modules.*.repository
    app.modules.*.models
allow_indirect_imports = True

[importlinter:contract:business-external]
name = Drivers, vendor SDKs, storage, LLM and environment only through core
type = forbidden
source_modules = app.modules
forbidden_modules =
    asyncpg
    aiomysql
    pymysql
    psycopg
    psycopg2
    asyncmy
    sqlite3
    litellm
    openai
    anthropic
    minio
    boto3
    redis
    arq
    os
    logging
    structlog
    sqlglot
allow_indirect_imports = True

[importlinter:contract:api-service-no-orm]
name = Only repositories and models import the ORM
type = forbidden
source_modules =
    app.modules.*.api
    app.modules.*.service
forbidden_modules = sqlalchemy
allow_indirect_imports = True
