name: kingbase
version: v1
template:
  quot_rule: |
    Quote every table and column identifier with double quotes: "schema"."table", "t"."column".
    Unquoted identifiers fold to lowercase; quote to preserve casing or escape keywords.
  limit_rule: |
    Limit rows with LIMIT <count> [OFFSET <start>] on the OUTERMOST query only.
    Never place LIMIT inside a subquery or CTE.
  date_rule: |
    Date/time: use DATE_TRUNC('month', column) for bucketing, CURRENT_DATE for today,
    and column::date or date + interval '1 day' for arithmetic.
    Compare dates with plain 'YYYY-MM-DD' string literals; never wrap them in CAST.
    When grouping by a truncated timestamp, cast the result to a plain date:
    DATE_TRUNC('month', column)::date.
  string_rule: |
    Strings: concatenate with a || b or CONCAT(a, b).
  cast_rule: |
    Casting: use expr::type or CAST(expr AS type).
  null_rule: |
    NULL: compare with IS NULL / IS NOT NULL; substitute with COALESCE(expr, value).
  product_rule: |
    KingbaseES compatibility: KingbaseES is PostgreSQL-compatible but may support Oracle-compatible modes.
    Always write PostgreSQL syntax (double quotes, :: casts, DATE_TRUNC, date + interval).
    Do not use Oracle-style syntax even if the server supports it.
  forbidden_rule: |
    Forbidden in KingbaseES: IFNULL, GROUP_CONCAT, DATE_ADD, DATE_SUB, backtick quoting.
    Use COALESCE, string_agg and date + interval instead.
  examples: |
    <example>
      <output-bad>
        SELECT IFNULL(`memo`, '-') FROM `orders`  -- wrong: IFNULL and backticks are not KingbaseES-compatible
        SELECT `id`, `amount` FROM (SELECT `id`, `amount` FROM `orders` LIMIT 10) `t` LIMIT 5  -- wrong: LIMIT inside a subquery
      </output-bad>
      <output-good>
        SELECT "o"."id" AS "order_id", "o"."amount" AS "amount"
        FROM "sales"."orders" "o"
        WHERE "o"."created_at" >= '2025-03-01'
          AND "o"."created_at" < '2025-04-01'
          AND "o"."status" IS NOT NULL
        ORDER BY "o"."amount" DESC
        LIMIT 10
      </output-good>
    </example>
