<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoginStates · AskData UI Kit</title>
<script>if (location.hash === "#dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.setAttribute("data-theme", "light");</script>
<link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../styles/components.css"></head>
<body style="padding:16px;background:var(--bg-app);color:var(--text-1);font-family:var(--font-sans)">
<div class="ak-row" style="align-items:stretch;gap:12px"><div class="ak-card" style="padding:16px;flex:1;min-width:240px"><div class="ak-t3" style="font-size:12px;margin-bottom:10px">密码错误</div><div class="ak-col" style="gap:12px"><div class="ak-callout ak-callout-danger"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><div><b>账号或密码不正确</b>请检查后重新输入。</div></div><div class="ak-field" data-state="error"><label class="ak-label">密码</label><div class="ak-input ak-input-lg"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v10H6zM8 11V8a4 4 0 0 1 8 0v3"/></svg><input type="password" value="wrongpass"><button class="ak-reveal" type="button" aria-pressed="false">显示</button></div></div></div></div><div class="ak-card" style="padding:16px;flex:1;min-width:240px"><div class="ak-t3" style="font-size:12px;margin-bottom:10px">大写锁定 + 显示密码</div><div class="ak-col" style="gap:12px"><div class="ak-field" data-state="warn"><label class="ak-label">密码</label><div class="ak-input ak-input-lg"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v10H6zM8 11V8a4 4 0 0 1 8 0v3"/></svg><input type="text" value="HUNTER2"><button class="ak-reveal" type="button" aria-pressed="true">隐藏</button></div><div class="ak-hint" role="status"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17.5v.01"/></svg>大写锁定已开启</div></div></div></div><div class="ak-card" style="padding:16px;flex:1;min-width:240px"><div class="ak-t3" style="font-size:12px;margin-bottom:10px">请求过于频繁</div><div class="ak-col" style="gap:12px"><div class="ak-callout ak-callout-warning"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v10H6zM8 11V8a4 4 0 0 1 8 0v3"/></svg><div><b>尝试次数过多</b>请稍后再试。急需使用请联系管理员。</div></div><button class="ak-btn ak-btn-primary ak-btn-lg ak-btn-block" disabled>登录</button></div></div><div class="ak-card" style="padding:16px;flex:1;min-width:240px"><div class="ak-t3" style="font-size:12px;margin-bottom:10px">提交中</div><div class="ak-col" style="gap:12px"><button class="ak-btn ak-btn-primary ak-btn-lg ak-btn-block" disabled><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></svg>登录中…</button></div></div></div>
<script src="../styles/runtime.js"></script>
