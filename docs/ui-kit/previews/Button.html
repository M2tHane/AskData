<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button · AskData UI Kit</title>
<script>if (location.hash === "#dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.setAttribute("data-theme", "light");</script>
<link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../styles/components.css"></head>
<body style="padding:16px;background:var(--bg-app);color:var(--text-1);font-family:var(--font-sans)">
<div class="ak-col"><div class="ak-row">
<button class="ak-btn ak-btn-primary"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建数据源</button>
<button class="ak-btn ak-btn-secondary"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></svg>立即同步</button>
<button class="ak-btn ak-btn-ghost"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>导出 CSV</button>
<button class="ak-btn ak-btn-danger">停用</button>
<button class="ak-btn ak-btn-secondary" disabled>保存</button></div>
<div class="ak-row"><button class="ak-btn ak-btn-secondary ak-btn-sm">重跑</button><button class="ak-btn ak-btn-ghost ak-btn-sm"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h11v11H9zM5 15V4h11"/></svg>复制</button><button class="ak-btn ak-btn-secondary ak-btn-icon" aria-label="刷新"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></svg></button></div></div>
<script src="../styles/runtime.js"></script>
</body>
</html>
