<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast · AskData UI Kit</title>
<script>if (location.hash === "#dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.setAttribute("data-theme", "light");</script>
<link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../styles/components.css"></head>
<body style="padding:16px;background:var(--bg-app);color:var(--text-1);font-family:var(--font-sans)">
<div class="ak-row" style="align-items:flex-start;gap:32px"><div class="ak-toasts ak-toasts-static" style="width:340px"><div class="ak-toast ak-toast-success"><span class="ak-toast-ic"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div class="ak-toast-text"><b>语义已保存</b><span>orders 表 3 处修改，下次提问生效</span></div><button class="ak-icon-btn" type="button" aria-label="关闭通知"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><i class="ak-toast-bar"></i></div><div class="ak-toast ak-toast-info"><span class="ak-toast-ic"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v6M12 7.5v.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg></span><div class="ak-toast-text"><b>评测 #41 已完成</b><span>通过率 91.4%，比上次 +3.1 pt</span><button class="ak-link" type="button">查看</button></div><button class="ak-icon-btn" type="button" aria-label="关闭通知"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><i class="ak-toast-bar"></i></div><div class="ak-toast ak-toast-warning"><span class="ak-toast-ic"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 16.5v.01M10.3 4.3L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg></span><div class="ak-toast-text"><b>销售库同步完成，发现 2 处字段变化</b><span>指标「客单价」受影响</span><button class="ak-link" type="button">查看</button></div><button class="ak-icon-btn" type="button" aria-label="关闭通知"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><i class="ak-toast-bar"></i></div><div class="ak-toast ak-toast-danger"><span class="ak-toast-ic"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 16.5v.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg></span><div class="ak-toast-text"><b>这张卡片刷新失败</b><span>字段 paid_amt 不存在</span></div><button class="ak-icon-btn" type="button" aria-label="关闭通知"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><i class="ak-toast-bar"></i></div></div><div class="ak-col" style="gap:8px"><span class="ak-t3" style="font-size:12px">点一下试试（会从右下角弹出）</span><button class="ak-btn ak-btn-secondary" type="button" data-toast="{&quot;tone&quot;: &quot;success&quot;, &quot;title&quot;: &quot;语义已保存&quot;, &quot;text&quot;: &quot;orders 表 3 处修改，下次提问生效&quot;}">成功</button><button class="ak-btn ak-btn-secondary" type="button" data-toast="{&quot;tone&quot;: &quot;info&quot;, &quot;title&quot;: &quot;评测 #41 已完成&quot;, &quot;text&quot;: &quot;通过率 91.4%，比上次 +3.1 pt&quot;, &quot;action&quot;: &quot;查看&quot;}">平台通知</button><button class="ak-btn ak-btn-secondary" type="button" data-toast="[{&quot;tone&quot;: &quot;info&quot;, &quot;title&quot;: &quot;正在同步表结构&quot;}, {&quot;tone&quot;: &quot;warning&quot;, &quot;title&quot;: &quot;同步完成，发现 2 处字段变化&quot;, &quot;text&quot;: &quot;指标「客单价」受影响&quot;, &quot;action&quot;: &quot;查看&quot;, &quot;delay&quot;: 1500}]">先进行中，再完成</button><button class="ak-btn ak-btn-secondary" type="button" data-toast="{&quot;tone&quot;: &quot;danger&quot;, &quot;title&quot;: &quot;这张卡片刷新失败&quot;, &quot;text&quot;: &quot;字段 paid_amt 不存在&quot;}">失败</button></div></div>
<script src="../styles/runtime.js"></script>
</body>
</html>
