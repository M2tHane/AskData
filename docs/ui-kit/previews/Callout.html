<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callout · AskData UI Kit</title>
<script>if (location.hash === "#dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.setAttribute("data-theme", "light");</script>
<link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../styles/components.css"></head>
<body style="padding:16px;background:var(--bg-app);color:var(--text-1);font-family:var(--font-sans)">
<div class="ak-col">
<div class="ak-callout ak-callout-info"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5v.01"/></svg><div><b>口径说明</b>「销售额」= 已支付订单金额，不含退款，按下单日期归属月份。</div></div>
<div class="ak-callout ak-callout-warning"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17.5v.01"/></svg><div><b>销售分析组 Token 配额已用到 86%</b>超过 100% 后，新的提问会被拒绝。</div></div>
<div class="ak-callout ak-callout-danger"><svg class="ak-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><div><b>账号或密码不正确</b>请检查后重新输入。</div></div></div>
<script src="../styles/runtime.js"></script>
</body>
</html>
