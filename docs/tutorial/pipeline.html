<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskData · 一次提问的全流程（QueryContext 流转演示）</title>
<style>
:root{
  --bg-app:#fff;--bg-sidebar:#f5f5f7;--bg-subtle:#efeff2;--bg-selected:#e4e4ea;--bg-card:#fff;
  --border:#e4e4e9;--border-strong:#cfcfd6;--text-1:#18181b;--text-2:#52525b;--text-3:#65656e;
  --action:#f97316;--action-text:#c2410c;--action-soft:#fff1e6;
  --info:#0063c7;--info-soft:#eaf3ff;--success:#007634;--success-soft:#e8f7ee;
  --warning:#a64a00;--warning-soft:#fef3c7;--danger:#b91c1c;--danger-soft:#fee2e2;
  --chart-1:#1f5f99;--chart-4:#d55e00;
  --code-keyword:#0063c7;--code-string:#007634;--code-number:#a64a00;
  --radius-control:6px;--radius-panel:10px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);--shadow-md:0 4px 12px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.6 var(--font-sans);color:var(--text-1);background:var(--bg-sidebar);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--bg-app);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .sub{color:var(--text-3);font-size:13px}
.seg{display:inline-flex;background:var(--bg-subtle);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font:inherit;font-size:13px;color:var(--text-2);cursor:pointer}
.seg button.on{background:var(--bg-card);color:var(--text-1);box-shadow:var(--shadow-sm);font-weight:600}
.ctrl{display:flex;gap:6px;align-items:center;margin-left:auto}
.btn{border:1px solid var(--border-strong);background:var(--bg-card);border-radius:var(--radius-control);height:30px;padding:0 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--text-1)}
.btn:hover{background:var(--bg-subtle)}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.counter{font:12px var(--font-mono);color:var(--text-3);min-width:56px;text-align:center}
.question{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--bg-app);border-bottom:1px solid var(--border)}
.bubble{background:var(--inverse-bg,#18181b);color:#fff;border-radius:14px;padding:6px 14px;font-size:14px}
.who{font-size:12px;color:var(--text-3)}
main{flex:1;display:grid;grid-template-columns:230px minmax(380px,1fr) minmax(380px,1.05fr);gap:12px;padding:12px;min-height:0}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-panel);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel>h2{font-size:12px;font-weight:600;color:var(--text-3);margin:0;padding:10px 14px;border-bottom:1px solid var(--border);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.scroll{overflow:auto;min-height:0;flex:1}
/* rail */
.rail{list-style:none;margin:0;padding:8px}
.rail li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;cursor:pointer;position:relative;color:var(--text-2)}
.rail li:hover{background:var(--bg-subtle)}
.rail li .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;font:600 11px var(--font-mono);background:var(--bg-card);flex:none;color:var(--text-3)}
.rail li .nm{font-size:13px;line-height:1.25}
.rail li .nm small{display:block;font:11px var(--font-mono);color:var(--text-3)}
.rail li .ms{margin-left:auto;font:11px var(--font-mono);color:var(--text-3)}
.rail li.done .dot{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.rail li.cur{background:var(--action-soft);color:var(--text-1)}
.rail li.cur .dot{background:var(--action);border-color:var(--action);color:#fff}
.rail li.skip{opacity:.4}
.rail li.skip .nm{text-decoration:line-through}
.rail li.err .dot{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.rail li.group{cursor:default;padding:10px 8px 2px;font-size:11px;color:var(--text-3);letter-spacing:.4px}
.rail li.group:hover{background:none}
/* detail */
.detail{padding:16px 18px}
.detail h3{margin:0 0 2px;font-size:18px}
.detail .loc{font:12px var(--font-mono);color:var(--text-3);margin-bottom:12px}
.detail .lead{color:var(--text-1);margin:0 0 12px}
.sec{margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.3px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--font-mono);padding:2px 8px;border-radius:999px;background:var(--bg-subtle);color:var(--text-2)}
.chip.w{background:var(--success-soft);color:var(--success)}
.chip.ev{background:var(--info-soft);color:var(--info)}
.chip.llm{background:var(--action-soft);color:var(--action-text)}
.chip.db{background:var(--warning-soft);color:var(--warning)}
.callout{border-radius:8px;padding:10px 12px;margin-top:12px;font-size:13px}
.callout.tip{background:var(--info-soft)}
.callout.warn{background:var(--warning-soft)}
.callout.bad{background:var(--danger-soft)}
.callout b{display:block;margin-bottom:2px}
pre.code{font:12px/1.55 var(--font-mono);background:var(--bg-sidebar);border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
.kw{color:var(--code-keyword);font-weight:600}.str{color:var(--code-string)}.num{color:var(--code-number)}
table.mini{border-collapse:collapse;font-size:12px;margin-top:6px}
table.mini th,table.mini td{border-bottom:1px solid var(--border);padding:3px 10px;text-align:left}
table.mini td.n{text-align:right;font-family:var(--font-mono)}
.bars{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px}
.bar span{width:46px;color:var(--text-2)}
.bar i{height:14px;background:var(--chart-1);border-radius:3px;display:block}
.bar em{font:11px var(--font-mono);color:var(--text-3);font-style:normal}
/* ctx */
.ctxtools{display:flex;gap:6px;margin-left:auto}
.ctxtools label{font-weight:400;font-size:12px;color:var(--text-2);display:flex;gap:4px;align-items:center;cursor:pointer}
.grp{padding:6px 12px 2px;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.4px;background:var(--bg-sidebar);border-top:1px solid var(--border);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
.f{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:5px 12px;border-bottom:1px solid var(--border);font-size:12px;align-items:start;transition:background .4s}
.f .k{font-family:var(--font-mono);color:var(--text-2);word-break:break-all}
.f .v{font-family:var(--font-mono);color:var(--text-1);white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto}
.f.empty .v{color:var(--text-3)}
.f.empty .k{color:var(--text-3)}
.f.new{background:var(--success-soft)}
.f.chg{background:var(--warning-soft)}
.f.clr{background:var(--danger-soft)}
.f .tag{display:inline-block;font:10px var(--font-sans);padding:0 5px;border-radius:4px;margin-left:4px;vertical-align:1px}
.f.new .tag{background:var(--success);color:#fff}
.f.chg .tag{background:var(--warning);color:#fff}
.f.clr .tag{background:var(--danger);color:#fff}
.hidden-empty .f.empty{display:none}
/* timeline */
footer{background:var(--bg-app);border-top:1px solid var(--border);padding:8px 20px 10px}
footer .row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3)}
.tl{position:relative;height:46px;margin-top:4px}
.tl .axis{position:absolute;left:0;right:0;top:28px;height:2px;background:var(--border)}
.tl .seg2{position:absolute;top:22px;height:14px;border-radius:3px;opacity:.85}
.tl .mk{position:absolute;top:2px;transform:translateX(-50%);font:10px var(--font-mono);color:var(--text-3);white-space:nowrap}
.tl .mk.on{color:var(--action-text);font-weight:700}
.tl .tick{position:absolute;top:18px;width:1px;height:20px;background:var(--border-strong)}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:flex;gap:4px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.stream{font:12px var(--font-mono);color:var(--text-2);margin-top:4px;max-height:52px;overflow:auto;white-space:nowrap}
.stream b{color:var(--info);font-weight:600}
@media (max-width:1100px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>一次提问的全流程</h1>
  <span class="sub">QueryContext 在各节点之间流转、被逐步填充 · 数据来自真实运行</span>
  <div class="seg" id="scen"></div>
  <div class="ctrl">
    <button class="btn" id="prev" title="←">上一步</button>
    <span class="counter" id="count"></span>
    <button class="btn" id="next" title="→">下一步</button>
    <button class="btn primary" id="play">自动播放</button>
  </div>
</header>
<div class="question"><span class="who" id="who"></span><span class="bubble" id="q"></span><span class="who" id="qnote"></span></div>
<main>
  <section class="panel"><h2>节点</h2><div class="scroll"><ul class="rail" id="rail"></ul></div></section>
  <section class="panel"><h2>这个节点做了什么</h2><div class="scroll"><div class="detail" id="detail"></div></div></section>
  <section class="panel">
    <h2>QueryContext <span class="ctxtools"><label><input type="checkbox" id="hideEmpty"> 隐藏空字段</label></span></h2>
    <div class="scroll" id="ctx"></div>
  </section>
</main>
<footer>
  <div class="row"><span>SSE 事件时间线（毫秒，相对请求开始）</span>
    <div class="legend" id="legend"></div></div>
  <div class="tl" id="tl"></div>
  <div class="stream" id="stream"></div>
</footer>

function visible(){ return steps.map((s, i) => [s, i]).filter(([s]) => !s.skip); }

function ctxAt(n){
  // apply writes of steps[0..n]; return {ctx, changed:{field:'new'|'chg'|'clr'}}
  const ctx = {}; let changed = {};
  for (const [s, i] of visible()) {
    if (i > n) break;
    const cur = {};
    for (const [k, v] of Object.entries(s.writes || {})) {
      let val = v;
      if (k === 'timings') val = {...(ctx.timings || {}), ...v};
      const before = k in ctx ? ctx[k] : (k in DEFAULTS ? DEFAULTS[k] : undefined);
      const was = JSON.stringify(before), now = JSON.stringify(val);
      if (i === n && was !== now) cur[k] = (before === undefined || isEmpty(before)) ? 'new' : (isEmpty(val) ? 'clr' : 'chg');
      ctx[k] = val;
    }
    if (i === n) changed = cur;
  }
  return {ctx, changed};
}

function render(){
  const step = steps[idx];
  const vis = visible().map(([, i]) => i);
  const pos = vis.indexOf(idx);
  document.getElementById('count').textContent = `${pos + 1} / ${vis.length}`;
  document.getElementById('prev').disabled = pos <= 0;
  document.getElementById('next').disabled = pos >= vis.length - 1;
  // question
  const sc = SCENARIOS[scen];
  document.getElementById('who').textContent = 'he.yu（经营分析部 · 员工）';
  document.getElementById('q').textContent = T[sc.turn].question;
  document.getElementById('qnote').textContent = sc.note;
  // rail
  const nodesInScen = new Set(steps.map(s => s.node));
  const statusOf = {};
  steps.forEach((s, i) => { statusOf[s.node] = s.skip ? 'skip' : (i < idx ? (s.err ? 'err' : 'done') : i === idx ? 'cur' : ''); });
  let n = 0;
  document.getElementById('rail').innerHTML = RAIL.map(([k, name, small]) => {
    if (k === 'g') return `<li class="group">${name}</li>`;
    if (!nodesInScen.has(k)) return '';
    n += 1;
    const st = statusOf[k] || '';
    const s = steps.find(x => x.node === k);
    const ms = s && s.ms != null && !s.skip ? `${s.ms} ms` : '';
    return `<li class="${st}" data-node="${k}"><span class="dot">${n}</span><span class="nm">${name}<small>${small}</small></span><span class="ms">${ms}</span></li>`;
  }).join('');
  document.querySelectorAll('#rail li[data-node]').forEach(li => li.onclick = () => {
    const i = steps.findIndex(s => s.node === li.dataset.node && !s.skip); if (i >= 0) { idx = i; stop(); render(); }
  });
  // detail
  const tagName = {llm:'调用模型', db:'读写数据库/缓存'};
  const writes = Object.keys(step.writes || {});
  let h = `<h3>${esc(step.title)}</h3><div class="loc">${esc(step.loc)}</div><p class="lead">${esc(step.lead)}</p>`;
  if (step.tags?.length || step.ms != null) h += `<div class="chips">${(step.tags||[]).map(t => `<span class="chip ${t}">${tagName[t]}</span>`).join('')}${step.ms != null ? `<span class="chip">耗时 ${step.ms} ms</span>` : ''}</div>`;
  h += `<div class="sec">做了什么</div><ul>${step.does.map(d => `<li>${esc(d)}</li>`).join('')}</ul>`;
  if (writes.length) h += `<div class="sec">写入 QueryContext</div><div class="chips">${writes.map(w => `<span class="chip w">${w}</span>`).join('')}</div>`;
  if (step.events?.length) h += `<div class="sec">推给前端的 SSE 事件</div><div class="chips">${step.events.map(e => `<span class="chip ev">${esc(e)}</span>`).join('')}</div>`;
  if (step.node === 'generate_sql' && step.writes.generated_sql) h += `<div class="sec">模型生成的 SQL</div><pre class="code">${sqlHtml(step.writes.generated_sql)}</pre>`;
  if (step.node === 'generate_sql' && T[sc.turn].reasoning) h += `<div class="sec">思考过程（reasoning 事件拼起来）</div><pre class="code">${esc(T[sc.turn].reasoning)}</pre>`;
  if (step.node === 'sql_guard' && step.writes.guarded_sql) h += `<div class="sec">规范化后的 SQL（执行的就是它）</div><pre class="code">${sqlHtml(step.writes.guarded_sql.normalized_sql)}</pre>`;
  if (step.extraHtml) h += step.extraHtml;
  if (step.node === 'presentation') h += `<div class="sec">流式结论（answer 事件拼起来）</div><pre class="code">${esc(T[sc.turn].answer)}</pre>`;
  if (step.branch) h += `<div class="callout warn"><b>其他走向</b>${step.branch.map(esc).join('<br>')}</div>`;
  if (step.tip) h += `<div class="callout tip"><b>${esc(step.tip[0])}</b>${esc(step.tip[1])}</div>`;
  if (step.err) h += `<div class="callout bad"><b>status = blocked</b>后面的 Guard、执行、纠错、展示都没有运行。</div>`;
  document.getElementById('detail').innerHTML = h;
  // ctx
  const {ctx, changed} = ctxAt(idx);
  let c = '';
  for (const [g, fields] of GROUPS) {
    c += `<div class="grp">${g}</div>`;
    for (const f of fields) {
      const has = f in ctx;
      const v = has ? ctx[f] : DEFAULTS[f];
      const empty = v === undefined || isEmpty(v);
      const cls = changed[f] || (empty ? 'empty' : '');
      const tag = changed[f] ? `<span class="tag">${{new:'新写入', chg:'更新', clr:'清空'}[changed[f]]}</span>` : '';
      const shown = v === undefined ? '—' : (f.endsWith('sql') && typeof v === 'string' ? v : pretty(v));
      c += `<div class="f ${cls}"><div class="k">${f}${tag}</div><div class="v">${esc(shown)}</div></div>`;
    }
  }
  const box = document.getElementById('ctx');
  box.innerHTML = c;
  const first = box.querySelector('.f.new,.f.chg,.f.clr');
  if (first) first.scrollIntoView({block:'nearest', behavior:'smooth'});
  renderTimeline();
}

const COLORS = {load_context:'#a1a1aa', visible_scope:'#71717a', retrieval:'#3589c0', clarification:'#d4d4d8', generate_sql:'#d55e00', sql_guard:'#00866a', execute:'#b07600', correction:'#d4d4d8', presentation:'#1f5f99', record:'#52525b'};
function renderTimeline(){
  const sc = SCENARIOS[scen], turn = sc.turn, ev = T[turn].events;
  const total = Math.max(...ev.map(e => e.t)) || 1;
  const stages = ev.filter(e => e.event === 'stage');
  const tl = document.getElementById('tl');
  const step = steps[idx];
  let h = '<div class="axis"></div>';
  stages.forEach((s, i) => {
    const end = i + 1 < stages.length ? stages[i + 1].t : total;
    const left = s.t / total * 100, w = Math.max(.3, (end - s.t) / total * 100);
    const on = s.data.name === step.node;
    h += `<div class="seg2" style="left:${left}%;width:${w}%;background:${COLORS[s.data.name] || '#999'};${on ? 'outline:2px solid var(--action);outline-offset:1px' : ''}" title="${s.data.name} ${end - s.t}ms"></div>`;
  });
  const marks = ev.filter(e => e.event !== 'stage');
  const seen = {};
  marks.forEach(e => {
    const left = e.t / total * 100;
    const key = Math.round(left);
    const row = seen[key] = (seen[key] || 0) + 1;
    if (row > 1) return;
    const label = marks.filter(x => Math.round(x.t / total * 100) === key).map(x => x.event).join('·');
    h += `<div class="tick" style="left:${left}%"></div><div class="mk ${step.events?.some(x => label.includes(x.split(' ')[0])) ? 'on' : ''}" style="left:${Math.min(97, Math.max(3, left))}%">${label} ${e.t}</div>`;
  });
  tl.innerHTML = h;
  document.getElementById('legend').innerHTML = Object.entries(COLORS).filter(([k]) => stages.some(s => s.data.name === k)).map(([k, v]) => `<span><i style="background:${v}"></i>${k}</span>`).join('') + `<span>· 总 ${total} ms</span>`;
  const r = T[turn];
  const parts = [];
  for (const e of ev) {
    if (e.event === 'stage') parts.push(`<b>stage</b>:${e.data.name}`);
    else parts.push(`<b>${e.event}</b>`);
  }
  document.getElementById('stream').innerHTML = `事件顺序：${parts.join(' → ')}（另有 reasoning ×${r.n_reasoning}、answer ×${r.n_answer} 个增量事件穿插其中）`;
}

function go(d){
  const vis = visible().map(([, i]) => i);
  const pos = vis.indexOf(idx) + d;
  if (pos < 0 || pos >= vis.length) { stop(); return false; }
  idx = vis[pos]; render(); return true;
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById('play').textContent = '自动播放'; }
function play(){
  if (timer) { stop(); return; }
  if (!go(1)) { idx = visible()[0][1]; render(); }
  document.getElementById('play').textContent = '暂停';
  timer = setInterval(() => { if (!go(1)) stop(); }, 3200);
}
function setScen(i){
  scen = i; steps = SCENARIOS[i].build(); idx = 0; stop();
  document.querySelectorAll('#scen button').forEach((b, j) => b.classList.toggle('on', j === i));
  render();
}
document.getElementById('scen').innerHTML = SCENARIOS.map((s, i) => `<button>${s.name}</button>`).join('');
document.querySelectorAll('#scen button').forEach((b, i) => b.onclick = () => setScen(i));
document.getElementById('prev').onclick = () => { stop(); go(-1); };
document.getElementById('next').onclick = () => { stop(); go(1); };
document.getElementById('play').onclick = play;
document.getElementById('hideEmpty').onchange = e => document.getElementById('ctx').classList.toggle('hidden-empty', e.target.checked);
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { stop(); go(1); } if (e.key === 'ArrowLeft') { stop(); go(-1); } if (e.key === ' ') { e.preventDefault(); play(); } });
setScen(0);
</script>
</body>
</html>
