<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>Icon</title></head>
<body>
<div id="root" class="cb-root cb-pad"></div>
<script>
var C = window.ChatBI, h = React.createElement;

var NAMES = ['chat','database','table','chart','line','shield','lock','check','x','alert','info','help','play','copy','edit','download','thumbsUp','thumbsDown','search','plus','send','users','book','sigma','upload','cpu','log','flask','flag','refresh','eyeOff','sparkle'];
function App() { return h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(8, 1fr)', gap: 12 } }, NAMES.map(function (n) { return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, fontSize: 11, color: 'var(--ink-muted)', fontFamily: 'var(--font-mono)' } }, h('span', { style: { color: 'var(--ink)' } }, h(C.Icon, { name: n })), n); })); }
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script>
</body>
</html>
