<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>Trace</title></head>
<body>
<div id="root" class="cb-root cb-pad"></div>
<script>
var C = window.ChatBI, h = React.createElement;

function App() { return h(C.Trace, { steps: [
  { status: 'ok', label: '检索可见表和字段 · 命中 2 张表', time: '0.3 s' },
  { status: 'ok', label: '匹配语义：回款金额（团队级）', time: '0.1 s' },
  { status: 'ok', label: '生成 SQL', time: '1.2 s' },
  { status: 'fail', label: '执行报错：Unknown column p.pay_time', time: '0.1 s' },
  { status: 'retry', label: '自动纠错 1/3 · 改用 paid_at', time: '0.9 s' },
  { status: 'run', label: '执行中…', time: '' } ] }); }
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script>
</body>
</html>
