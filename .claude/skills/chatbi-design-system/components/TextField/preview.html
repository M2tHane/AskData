<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>TextField</title></head>
<body>
<div id="root" class="cb-root cb-pad"></div>
<script>
var C = window.ChatBI, h = React.createElement;

function App() { return h('div', { className: 'cb-col', style: { maxWidth: 380 } },
  h(C.TextField, { label: '主机', defaultValue: '10.2.8.14', hint: '只接受内网地址' }),
  h(C.TextField, { label: '只读账号', defaultValue: 'bi_admin', error: '该账号拥有 INSERT 权限，请换成只读账号' }),
  h(C.TextField, { icon: 'search', placeholder: '搜索表、字段或别名' })); }
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script>
</body>
</html>
