<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>Button</title></head>
<body>
<div id="root" class="cb-root cb-pad"></div>
<script>
var C = window.ChatBI, h = React.createElement;

function App() { return h('div', { className: 'cb-col' },
  h('div', { className: 'cb-row' }, h(C.Button, { variant: 'primary', icon: 'play' }, '执行查询'), h(C.Button, null, '试跑'), h(C.Button, { variant: 'ghost', icon: 'edit' }, '编辑 SQL'), h(C.Button, { variant: 'danger' }, '驳回申请'), h(C.Button, { variant: 'primary', disabled: true }, '保存指标')),
  h('div', { className: 'cb-row' }, h(C.Button, { size: 'sm', variant: 'primary' }, '通过'), h(C.Button, { size: 'sm' }, '转为评测样例'), h(C.Button, { size: 'sm', variant: 'ghost', icon: 'download' }, 'CSV'), h(C.Button, { size: 'sm', icon: 'copy', 'aria-label': '复制' }), h('button', { className: 'cb-link' }, '查看 SQL'))); }
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script>
</body>
</html>
