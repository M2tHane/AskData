<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>SqlBlock</title></head>
<body>
<div id="root" class="cb-root cb-pad"></div>
<script>
var C = window.ChatBI, h = React.createElement;
var SQL = "SELECT s.sales_name AS 销售,\n       SUM(p.amount)  AS 回款金额,\n       COUNT(*)       AS 回款笔数\nFROM   payment p\nJOIN   sales s ON s.id = p.sales_id\nWHERE  s.region = '华东'\n  AND  p.paid_at >= '2026-09-01' AND p.paid_at < '2026-10-01'\nGROUP  BY s.sales_name\nORDER  BY 回款金额 DESC\nLIMIT  1000";
function App() { return h(C.SqlBlock, { sql: SQL, meta: '0.8 s · 5 行' }); }
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script>
</body>
</html>
