<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>ChartCard</title></head>
<body>
<div id="root" class="cb-root cb-pad"></div>
<script>
var C = window.ChatBI, h = React.createElement;
var DATA = [{ label: '周敏', values: [1284300] }, { label: '陈立', values: [962150] }, { label: '王一舟', values: [804900] }, { label: '李嘉', values: [611020] }, { label: '赵晴', values: [402880] }];
var DATA2 = [{ label: '4月', values: [312, 240] }, { label: '5月', values: [338, 262] }, { label: '6月', values: [401, 290] }, { label: '7月', values: [385, 318] }, { label: '8月', values: [442, 351] }, { label: '9月', values: [468, 406] }];
function App() { return h('div', { className: 'cb-col', style: { gap: 16 } }, h(C.ChartCard, { title: '9 月华东区回款金额（元）', data: DATA, series: ['回款金额'] }), h(C.ChartCard, { title: '华东区 下单 vs 回款（万元）', data: DATA2, series: ['下单金额', '回款金额'], type: 'line', format: function (v) { return String(v); } })); }
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script>
</body>
</html>
