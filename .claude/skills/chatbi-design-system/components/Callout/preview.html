<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>Callout</title></head>
<body>
<div id="root" class="cb-root cb-pad"></div>
<script>
var C = window.ChatBI, h = React.createElement;

function App() { return h('div', { className: 'cb-col' },
  h(C.Callout, { tone: 'danger', title: '查询已拦截：包含 2 条语句' }, '只允许单条 SELECT。已记录到查询日志，原因：multi_statement。'),
  h(C.Callout, { tone: 'warning', title: 'SQL 执行报错，正在自动纠错（第 2 次，共 3 次）' }, 'Unknown column \'p.pay_time\' → 改用 payment.paid_at'),
  h(C.Callout, { tone: 'info', title: '你看不到 customer.id_card' }, '该字段未对你的团队开放。需要时请联系团队负责人。'),
  h(C.Callout, { tone: 'success', title: '指标试跑通过', actions: h('button', { className: 'cb-link' }, '查看试跑结果') }, '返回 12 行，耗时 0.6 s。')); }
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script>
</body>
</html>
