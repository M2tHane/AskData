<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>QueryLog</title></head>
<body>
<div id="root" class="cb-root"></div>
<script>
var C = window.ChatBI, h = React.createElement;
var NAV = [
  { label: '查数', items: [{ id: 'chat', label: '对话', icon: 'chat' }, { id: 'history', label: '我的会话', icon: 'log', count: 12 }] },
  { label: '数据', items: [{ id: 'src', label: '数据源', icon: 'database' }, { id: 'schema', label: '表与字段', icon: 'table' }, { id: 'sem', label: '语义与别名', icon: 'book' }, { id: 'metric', label: '指标', icon: 'sigma' }] },
  { label: '治理', items: [{ id: 'perm', label: '权限', icon: 'shield' }, { id: 'fb', label: '反馈', icon: 'flag', count: 4 }, { id: 'logs', label: '查询日志', icon: 'log' }, { id: 'eval', label: '评测', icon: 'flask' }, { id: 'model', label: '模型配置', icon: 'cpu' }] }
];
var FOOT = h('div', null, '华东销售组 · 团队负责人', h('br'), '只读账号执行 · 每次查询留痕');
function App() {
  return h('div', { className: 'cb-app' },
    h(C.Sidebar, { active: 'logs', groups: NAV, footer: FOOT }),
    h('div', { className: 'cb-main' },
      h('header', { className: 'cb-topbar' }, h('span', { className: 'cb-title' }, '查询日志'), h(C.Badge, null, '华东销售组 · 保留 90 天'), h('span', { className: 'cb-spacer' }), h(C.Button, { icon: 'download' }, '导出')),
      h('div', { className: 'cb-work', style: { gridTemplateColumns: 'repeat(4, 1fr)', alignContent: 'start' } },
        [['1,284', '本周提问'], ['92.4%', '首次执行成功'], ['17', '被拦截'], ['4', '待处理反馈']].map(function (s, i) { return h(C.Panel, { key: i }, h('div', { className: 'cb-stat' }, h('b', null, s[0]), h('span', null, s[1]))); }),
        h('div', { style: { gridColumn: '1 / -1' } },
          h(C.Panel, { title: '最近查询', actions: h(C.Tabs, { items: [{ id: 'all', label: '全部' }, { id: 'b', label: '已拦截', count: 17 }, { id: 'f', label: '纠错后成功', count: 41 }] }) },
            h('div', { style: { marginBottom: 12 } }, h(C.Callout, { tone: 'info' }, '只保存 SQL 和结果摘要（行数、前 5 行），不保存完整结果。被拦截的请求同样记录，并带原因代码。')),
            h(C.RunList, { rows: [
              { status: 'ok', question: '上个月华东区每个销售的回款金额', detail: '5 行 · 0.8 s · gpt-4.1 · 3.2k tokens', user: '周敏', id: 'q_8812', time: '今天 14:22' },
              { status: 'blocked', question: '把 sales 表里离职的人删掉', reason: '已拦截 · non_select：只允许 SELECT', user: '陈立', id: 'q_8809', time: '今天 11:05' },
              { status: 'fixed', question: '各渠道 9 月新增客户数', detail: '纠错 1 次 · 12 行 · 2.1 s', user: '李嘉', id: 'q_8801', time: '今天 09:40' },
              { status: 'clarify', question: '销售额最高的产品', detail: '等待用户选择口径', user: '王一舟', id: 'q_8790', time: '昨天 17:12' },
              { status: 'error', question: '去年每个月的退货率', detail: '纠错 3 次仍失败 · 已转反馈', user: '周敏', id: 'q_8771', time: '昨天 10:03' },
              { status: 'blocked', question: '看一下 information_schema 里有哪些表', reason: '已拦截 · system_table：禁止访问系统表', user: '赵晴', id: 'q_8744', time: '周一 16:40' } ] }))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script>
</body>
</html>
