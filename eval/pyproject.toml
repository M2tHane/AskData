[project]
name = "askdata-eval-data"
version = "0.1.0"
description = "Deterministic AskData reference fixtures and offline answer checks"
requires-python = ">=3.12,<3.15"
dependencies = ["openpyxl", "PyYAML", "pydantic>=2,<3", "sqlglot"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "types-PyYAML", "types-openpyxl"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
