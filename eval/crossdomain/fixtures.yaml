version: 1
# Cross-domain evaluation fixtures (hospital). Same contract as eval/fixtures.yaml, read by
# app.modules.eval.assets.EvalAssets when ASKDATA_EVAL_ASSETS_PATH points at this directory.
clock:
  now: '2025-07-10T09:30:00+08:00'
  timezone: Asia/Shanghai
  week_start: monday
  intervals: half_open
seed: 'XD:hosp:20250710'
teams:
  - {id: clinical, name: 医务部}
  - {id: finance, name: 财务部}
users:
  - {id: admin, role: admin, team_id: null}
  - {id: clin_member, role: member, team_id: clinical}
  - {id: fin_member, role: member, team_id: finance}
datasources:
  hospital:
    type: postgresql
    dialect: postgres
    schema: hosp
    bootstrap: hospital.sql
  # Uploaded through the real upload API (preview -> confirm / add_sheet / append) by the
  # admin on behalf of the owner team; the owner team is granted every column on publish.
  up_budget:
    type: upload
    dialect: postgres
    schema: up_budget
    owner_team_id: finance
    manifest: files/manifest.json
  up_lab:
    type: upload
    dialect: postgres
    schema: up_lab
    owner_team_id: clinical
    manifest: files/manifest.json
  up_equip:
    type: upload
    dialect: postgres
    schema: up_equip
    owner_team_id: finance
    manifest: files/manifest.json
  up_care:
    type: upload
    dialect: postgres
    schema: up_care
    owner_team_id: clinical
    manifest: files/manifest.json
  up_feedback:
    type: upload
    dialect: postgres
    schema: up_feedback
    owner_team_id: clinical
    manifest: files/manifest.json
catalog:
  hospital:
    dept: [id, dept_cd, name, parent_id, kind]
    ward: [id, name, dept_id, bed_cnt]
    doctor: [id, staff_no, name, dept_id, title_cd, sup_id, hired_on, status]
    patient: [id, mrn, name, gender, birth_dt, ins_type, phone, id_no, created_at]
    icd: [code, name, chapter]
    op_visit: [id, visit_no, patient_id, dept_id, doctor_id, reg_at, seen_at, vtype, status, reg_fee]
    admission: [id, adm_no, patient_id, dept_id, ward_id, attending_id, op_visit_id, adm_at, dis_at, adm_src, dis_status]
    dx: [id, adm_id, visit_id, icd_cd, is_main, dx_at]
    charge: [id, adm_id, visit_id, item_cat, item_name, qty, price, amt, chg_at]
    settle: [id, adm_id, settle_at, tot_amt, fund_amt, self_amt, status]
  up_budget:
    budget: [dept_code, dept_name, month, budget]
    bed_plan: [ward_name, dept_code, month, beds]
  up_lab:
    lab_recon: [send_date, mrn, item, amount, status]
  up_equip:
    equipment: [asset_no, dept_name, bought_on, cost]
  up_care:
    caregiver: [record_no, service_date, ward, hours, amount]
  up_feedback:
    feedback: [fb_no, visit_date, dept_name, score, comment]
# The clinical team sees clinical data but no settlements and no patient phone / ID number.
