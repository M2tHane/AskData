      ward:
        leader_columns: [id, name, dept_id, bed_cnt]
        member_columns: [id, name, dept_id, bed_cnt]
      patient:
        leader_columns: [id, mrn, name, gender, birth_dt, ins_type, created_at]
        member_columns: [id, mrn, name, gender, birth_dt, ins_type, created_at]
      admission:
        leader_columns: [id, adm_no, patient_id, dept_id, ward_id, attending_id, op_visit_id, adm_at, dis_at, adm_src, dis_status]
        member_columns: [id, adm_no, patient_id, dept_id, ward_id, attending_id, op_visit_id, adm_at, dis_at, adm_src, dis_status]
