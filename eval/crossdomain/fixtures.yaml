# Column semantics an administrator fills in during setup for columns without a comment.
# Deliberately terse: code meanings live only in the business glossary below.
setup_descriptions:
  dept.kind: 科室类别
  doctor.title_cd: 职称代码
  doctor.sup_id: 上级医师ID
  op_visit.vtype: 就诊类型代码
  admission.dis_status: 离院方式代码
  settle.fund_amt: 统筹支付金额
semantics:
  - id: insured_patient
    scope: platform
    datasource: hospital
    target: patient.ins_type
    aliases: [医保患者, 参保患者, 职工医保, 居民医保]
    definition: "医保患者 = ins_type IN ('UEBMI','URRBMI')：UEBMI 城镇职工医保，URRBMI 城乡居民医保；SELF 自费、COMM 商业保险不算医保患者"
  - id: senior_doctor
    scope: platform
    datasource: hospital
    target: doctor.title_cd
    aliases: [高年资医生, 高级职称, 主任医师, 副主任医师]
    definition: '职称代码：1 住院医师，2 主治医师，3 副主任医师，4 主任医师；高年资医生 = title_cd IN (3,4)'
  - id: internal_med
    scope: platform
    datasource: hospital
    target: dept.parent_id
    aliases: [内科系统, 大内科]
    definition: '科室分两级；内科系统 = 上级科室为「内科」（dept_cd NK）的全部专科：心血管内科、呼吸内科、消化内科'
  - id: discharge_status
    scope: platform
    datasource: hospital
    target: admission.dis_status
    aliases: [离院方式, 死亡病例, 治愈, 好转, 转院]
    definition: '离院方式：1 治愈，2 好转，3 未愈，4 死亡，5 转院；在院患者为空。死亡病例 = dis_status = 4'
  - id: visit_type
    scope: platform
    datasource: hospital
    target: op_visit.vtype
    aliases: [初诊, 复诊, 急诊, 就诊类型]
    definition: '就诊类型：1 初诊，2 复诊，3 急诊'
  - id: fund_paid_column
    scope: platform
    datasource: hospital
    target: settle.fund_amt
    aliases: [统筹支付, 医保基金支付, 医保支付]
    definition: '医保统筹基金支付的金额；只计有效结算（status = 1），已冲销的不算'
  - id: record_no
    scope: platform
    datasource: hospital
    target: patient.mrn
    aliases: [病案号, 病历号]
    definition: '8 位病案号，文本，保留前导零'
metrics:
  - id: op_visits
    name: 门诊人次
    scope: platform
    datasource: hospital
    definition: '已接诊（status = 1）的门急诊就诊次数，按接诊时间 seen_at 统计；不含未接诊和退号'
    sql_template: 'SELECT COUNT(*) FROM hosp.op_visit WHERE status = 1'
  - id: alos
    name: 平均住院日
    scope: platform
    datasource: hospital
    definition: '出院患者的平均住院天数，按出院时间 dis_at 统计；住院天数 = 出院日期 − 入院日期，当天出院按 1 天；在院患者不计'
    sql_template: 'SELECT ROUND(AVG(GREATEST(dis_at::date - adm_at::date, 1)), 2) FROM hosp.admission WHERE dis_at IS NOT NULL'
  - id: avg_ip_cost
    name: 次均住院费用
    scope: platform
    datasource: hospital
    definition: '出院患者住院费用明细合计（含冲红负数）÷ 出院人次，按出院时间统计；不用结算单金额'
    sql_template: 'SELECT SUM(c.amt) / COUNT(DISTINCT a.id) FROM hosp.admission a JOIN hosp.charge c ON c.adm_id = a.id WHERE a.dis_at IS NOT NULL'
  - id: drug_ratio
    name: 药占比
    scope: platform
    datasource: hospital
    definition: '药品费用 ÷ 总费用，均取费用明细 charge.amt（门诊和住院都算，含冲红），按计费时间 chg_at 统计'
    sql_template: "SELECT SUM(CASE WHEN item_cat = 'DRUG' THEN amt ELSE 0 END) / SUM(amt) FROM hosp.charge"
  - id: fund_paid
    name: 医保统筹支付额
    scope: platform
    datasource: hospital
    definition: '有效住院结算（status = 1）的统筹支付金额合计，按结算时间 settle_at 统计'
    sql_template: 'SELECT SUM(fund_amt) FROM hosp.settle WHERE status = 1'
