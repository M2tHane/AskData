name: askdata
# Infrastructure ports are published only by the explicit development override.
x-runtime: &runtime
  image: askdata-backend:0.1.0
  build:
    context: ..
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  networks: [internal]
  environment: &environment
    ASKDATA_ENVIRONMENT: production
    ASKDATA_DATABASE_URL: postgresql+asyncpg://askdata:${META_DB_PASSWORD:?required}@pg-meta:5432/askdata
    ASKDATA_REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
    ASKDATA_JWT_SECRET: ${JWT_SECRET:?required}
    ASKDATA_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
    ASKDATA_MINIO_ENDPOINT: minio:9000
    ASKDATA_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?required}
    ASKDATA_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?required}
    ASKDATA_MINIO_BUCKET: askdata
    ASKDATA_MINIO_SECURE: 'false'
    ASKDATA_IMPORT_READER_PASSWORD: ${IMPORT_READER_PASSWORD:?required}
    ASKDATA_IMPORT_READER_HOST: pg-import
    ASKDATA_IMPORT_READER_DATABASE: askdata_import
    ASKDATA_SCHEDULER_ADMIN_ID: ${SCHEDULER_ADMIN_ID:-}
    ASKDATA_EVAL_ASSETS_PATH: /app/eval
    ASKDATA_EVAL_TEAM_IDS: '${EVAL_TEAM_IDS:-{}}'
    ASKDATA_EVAL_USER_IDS: '${EVAL_USER_IDS:-{}}'
    ASKDATA_EVAL_DATASOURCE_IDS: '${EVAL_DATASOURCE_IDS:-{}}'
    ASKDATA_EVAL_SEMANTIC_ALIASES: '${EVAL_SEMANTIC_ALIASES:-{}}'
    ASKDATA_EVAL_METRIC_ALIASES: '${EVAL_METRIC_ALIASES:-{}}'
services:
  migrate:
    <<: *runtime
    restart: 'no'
    command: [alembic, upgrade, head]
    depends_on:
      pg-meta: {condition: service_healthy}
  api:
    <<: *runtime
    # Never receives ASKDATA_IMPORT_WRITER_URL or the write password.
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    expose: ['8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      pg-meta: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *runtime
    command: [arq, app.worker.WorkerSettings]
    healthcheck:
      test: [CMD, arq, --check, app.worker.WorkerSettings]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    environment:
      <<: *environment
      ASKDATA_IMPORT_WRITER_URL: postgresql://import_writer:${IMPORT_WRITER_PASSWORD:?required}@pg-import:5432/askdata_import
    depends_on:
      migrate: {condition: service_completed_successfully}
      pg-meta: {condition: service_healthy}
      pg-import: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  pg-meta:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: askdata
      POSTGRES_USER: askdata
      POSTGRES_PASSWORD: ${META_DB_PASSWORD:?required}
    volumes: [meta-data:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U askdata -d askdata']
      interval: 5s
      retries: 10
  pg-import:
    entrypoint: [/bin/sh, /opt/askdata/start-import.sh]
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: askdata_import
      POSTGRES_USER: import_admin
      POSTGRES_PASSWORD: ${IMPORT_ADMIN_PASSWORD:?required}
      IMPORT_WRITER_PASSWORD: ${IMPORT_WRITER_PASSWORD:?required}
    volumes:
      - import-data:/var/lib/postgresql
      - ./init-import.sh:/opt/askdata/init-import.sh:ro
      - ./start-import.sh:/opt/askdata/start-import.sh:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U import_admin -d askdata_import && psql -U import_admin -d askdata_import -tAc \"SELECT 1 FROM pg_roles WHERE rolname='import_writer'\" | grep -q 1"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      retries: 10
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?required}
    command: [server, /data, --console-address, ':9001']
    volumes: [minio-data:/data]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      retries: 10
  minio-init:
    <<: *runtime
    restart: 'no'
    command: [python, /app/deploy/bootstrap_minio.py]
    depends_on:
      minio: {condition: service_healthy}
volumes:
  meta-data:
  import-data:
  redis-data:
  minio-data:
networks:
  internal:
    # No published ports. Egress remains available for model API calls.
    driver: bridge
