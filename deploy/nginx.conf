# Optional future ingress; the current Compose web service remains commented.
# Run nginx -t separately when the image is available; no frontend assets are served.
server {
    listen 80;
    server_name _;
    client_max_body_size 70m; # Base64 envelope for the 50 MiB source file limit.

    location = /healthz {
        proxy_pass http://api:8000/healthz;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no always;
    }
}
